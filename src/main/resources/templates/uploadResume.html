<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Resume · AI Interview Prep</title>
    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b1120, #030712);
            padding: 1.5rem;
            margin: 0;
            position: relative;
        }

        /* animated background glow */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.08), transparent 50%),
            radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.06), transparent 40%);
            pointer-events: none;
        }

        /* ---------- glass card ---------- */
        .upload-card {
            max-width: 520px;
            width: 100%;
            padding: 3rem 2.5rem 2.8rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .upload-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* decorative top line */
        .upload-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, #a78bfa, transparent);
            border-radius: 100%;
            opacity: 0.6;
        }

        /* ---------- header ---------- */
        .upload-header {
            margin-bottom: 0.3rem;
        }

        .upload-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f9ff 0%, #b6d4ff 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .upload-sub {
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(203, 213, 225, 0.5);
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.8rem;
            display: inline-block;
        }

        /* ---------- file drop zone ---------- */
        .file-drop-zone {
            position: relative;
            margin: 1.5rem 0 1.8rem;
            border: 2px dashed rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 2.5rem 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-drop-zone:hover {
            border-color: rgba(167, 139, 250, 0.25);
            background: rgba(255, 255, 255, 0.04);
        }

        .file-drop-zone.dragover {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.05);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.05);
        }

        .file-icon {
            font-size: 3.5rem;
            display: block;
            margin-bottom: 0.8rem;
        }

        .file-drop-zone p {
            color: rgba(203, 213, 225, 0.6);
            font-size: 1rem;
            font-weight: 400;
        }

        .file-drop-zone .file-hint {
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.3);
            margin-top: 0.6rem;
        }

        /* hidden file input */
        .file-drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* file name display */
        .file-name-display {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #a78bfa;
            font-weight: 500;
            min-height: 1.5rem;
            transition: all 0.3s ease;
        }

        .file-name-display.empty {
            color: rgba(148, 163, 184, 0.2);
        }

        /* ---------- submit button ---------- */
        .btn-upload-submit {
            width: 100%;
            padding: 1rem 1.8rem;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: 0.4px;
            position: relative;
            overflow: hidden;
        }

        .btn-upload-submit:hover:not(:disabled) {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 16px 36px -8px rgba(37, 99, 235, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, #3b82f6, #8b5cf6);
        }

        .btn-upload-submit:active:not(:disabled) {
            transform: scale(0.98);
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.5);
        }

        .btn-upload-submit:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        /* subtle shine on button */
        .btn-upload-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        /* ---------- footer / back links ---------- */
        .upload-footer {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(203, 213, 225, 0.4);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(4px);
        }

        .back-link:hover {
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            transform: translateX(-3px);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .supported-formats {
            font-size: 0.7rem;
            color: rgba(148, 163, 184, 0.2);
            letter-spacing: 0.5px;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 480px) {
            .upload-card {
                padding: 2rem 1.5rem;
                border-radius: 36px;
            }
            .upload-header h2 {
                font-size: 1.7rem;
            }
            .file-drop-zone {
                padding: 2rem 1rem;
            }
            .file-icon {
                font-size: 2.8rem;
            }
            .btn-upload-submit {
                font-size: 0.95rem;
                padding: 0.85rem 1.4rem;
            }
            .upload-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.6rem;
            }
        }

        /* ---------- smooth pulse ---------- */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.05); }
            50% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0.01); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.05); }
        }
        .upload-card {
            animation: softPulse 4s infinite ease-in-out;
        }

        /* accessibility */
        .btn-upload-submit:focus-visible,
        .back-link:focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="upload-card">
    <div class="upload-header">
        <h2>📄 Upload Resume</h2>
        <div class="upload-sub">let AI analyze your profile</div>
    </div>

    <form action="/uploadResume" method="post" enctype="multipart/form-data" id="uploadForm">
        <!-- file drop zone -->
        <div class="file-drop-zone" id="dropZone">
            <span class="file-icon">📂</span>
            <p><strong>Drop your resume here</strong> or click to browse</p>
            <span class="file-hint">PDF, DOCX — max 10MB</span>
            <input type="file" name="resumeFile" id="fileInput" accept=".pdf,.docx,.doc" required />
        </div>

        <!-- file name display -->
        <div class="file-name-display empty" id="fileNameDisplay">no file selected</div>

        <button type="submit" class="btn-upload-submit" id="submitBtn" disabled>
            ⬆ Upload Resume
        </button>
    </form>

    <div class="upload-footer">
        <a href="/dashboard" class="back-link">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Dashboard
        </a>
        <span class="supported-formats">supported: PDF · DOCX</span>
    </div>
</div>

<script>
    // ---------- interactive file input ----------
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const dropZone = document.getElementById('dropZone');

    // update file name and enable button
    function updateFileUI() {
        if (fileInput.files.length > 0) {
            const fileName = fileInput.files[0].name;
            const fileSize = (fileInput.files[0].size / 1024 / 1024).toFixed(2);
            fileNameDisplay.textContent = `📎 ${fileName} (${fileSize} MB)`;
            fileNameDisplay.className = 'file-name-display';
            submitBtn.disabled = false;
        } else {
            fileNameDisplay.textContent = 'no file selected';
            fileNameDisplay.className = 'file-name-display empty';
            submitBtn.disabled = true;
        }
    }

    fileInput.addEventListener('change', updateFileUI);

    // drag-and-drop visual feedback
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            fileInput.files = e.dataTransfer.files;
            updateFileUI();
        }
    });

    // sync if user clicks and selects via the native dialog
    fileInput.addEventListener('click', (e) => {
        // reset to allow re-selecting same file
        e.target.value = null;
    });

    // reset UI if form is submitted (optional)
    document.getElementById('uploadForm').addEventListener('submit', function(e) {
        // you could add a loading state here
        submitBtn.textContent = '⏳ Uploading...';
        submitBtn.disabled = true;
    });
</script>
</body>
</html>
