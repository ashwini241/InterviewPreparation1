<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Successful · AI Interview Prep</title>
    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b1120, #030712);
            padding: 1.5rem;
            margin: 0;
            position: relative;
        }

        /* animated background glow */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.08), transparent 50%),
            radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.06), transparent 40%);
            pointer-events: none;
        }

        /* ---------- glass card ---------- */
        .success-card {
            max-width: 520px;
            width: 100%;
            padding: 3.5rem 2.8rem 3rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .success-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* decorative top line */
        .success-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #34d399, #a78bfa, transparent);
            border-radius: 100%;
            opacity: 0.6;
        }

        /* ---------- success icon (animated checkmark) ---------- */
        .success-icon-wrapper {
            margin: 0 auto 1.5rem;
            width: 100px;
            height: 100px;
            position: relative;
        }

        .success-circle {
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, rgba(52, 211, 153, 0.12), rgba(167, 139, 250, 0.08));
            border-radius: 50%;
            border: 2px solid rgba(52, 211, 153, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulseCircle 2s ease-in-out infinite;
            position: relative;
        }

        .success-circle::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(167, 139, 250, 0.1));
            filter: blur(12px);
            z-index: -1;
            animation: glowPulse 2s ease-in-out infinite;
        }

        .checkmark {
            font-size: 3.8rem;
            line-height: 1;
            animation: checkBounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            transform-origin: center;
        }

        /* ---------- animations ---------- */
        @keyframes checkBounce {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes pulseCircle {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.5;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* confetti particles (subtle) */
        .confetti-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            border-radius: 48px;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            animation: confettiFall 4s ease-in-out infinite;
        }

        .confetti:nth-child(1) {
            left: 10%;
            background: #34d399;
            animation-delay: 0s;
            height: 6px;
        }
        .confetti:nth-child(2) {
            left: 25%;
            background: #a78bfa;
            animation-delay: 0.8s;
            width: 10px;
            height: 4px;
        }
        .confetti:nth-child(3) {
            left: 45%;
            background: #38bdf8;
            animation-delay: 1.6s;
            height: 7px;
        }
        .confetti:nth-child(4) {
            left: 65%;
            background: #f472b6;
            animation-delay: 0.4s;
            width: 6px;
            height: 6px;
        }
        .confetti:nth-child(5) {
            left: 80%;
            background: #fbbf24;
            animation-delay: 1.2s;
            height: 5px;
        }
        .confetti:nth-child(6) {
            left: 35%;
            background: #34d399;
            animation-delay: 2s;
            width: 12px;
            height: 4px;
        }
        .confetti:nth-child(7) {
            left: 55%;
            background: #a78bfa;
            animation-delay: 0.6s;
            height: 8px;
        }
        .confetti:nth-child(8) {
            left: 90%;
            background: #38bdf8;
            animation-delay: 1.8s;
            width: 7px;
            height: 7px;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            20% {
                opacity: 1;
                transform: translateY(10px) rotate(180deg) scale(1);
            }
            80% {
                opacity: 1;
                transform: translateY(80px) rotate(360deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(120px) rotate(540deg) scale(0.5);
            }
        }

        /* ---------- header ---------- */
        .success-header {
            margin-bottom: 0.5rem;
        }

        .success-header h2 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #34d399 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }

        .success-sub {
            font-size: 1rem;
            color: rgba(203, 213, 225, 0.5);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        /* ---------- message ---------- */
        .success-message {
            margin: 1.8rem 0 2.5rem;
            padding: 1.2rem 1.5rem;
            background: rgba(52, 211, 153, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(52, 211, 153, 0.05);
        }

        .success-message p {
            color: rgba(203, 213, 225, 0.5);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .success-message strong {
            color: #e2e8f0;
            font-weight: 500;
        }

        /* ---------- action button ---------- */
        .btn-login {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 3rem;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border: none;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.4px;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            color: white;
            box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: scale(1.04) translateY(-3px);
            box-shadow: 0 16px 36px -8px rgba(37, 99, 235, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, #3b82f6, #8b5cf6);
        }

        .btn-login:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.5);
        }

        /* subtle shine on button */
        .btn-login::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        /* ---------- footer / back links ---------- */
        .success-footer {
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .back-link {
            color: rgba(203, 213, 225, 0.3);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.01);
        }

        .back-link:hover {
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
        }

        /* ---------- responsive ---------- */
        @media (max-width: 480px) {
            .success-card {
                padding: 2.5rem 1.5rem 2rem;
                border-radius: 36px;
            }
            .success-header h2 {
                font-size: 1.8rem;
            }
            .success-icon-wrapper {
                width: 80px;
                height: 80px;
            }
            .success-circle {
                width: 80px;
                height: 80px;
            }
            .checkmark {
                font-size: 3rem;
            }
            .btn-login {
                padding: 0.85rem 2rem;
                font-size: 0.95rem;
                width: 100%;
                justify-content: center;
            }
            .success-message {
                padding: 1rem 1.2rem;
            }
            .success-message p {
                font-size: 0.9rem;
            }
            .confetti {
                display: none; /* reduce animation on mobile for performance */
            }
            .success-footer {
                flex-direction: column;
                gap: 0.8rem;
            }
        }

        /* ---------- pulse animation for card ---------- */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.05); }
            50% { box-shadow: 0 0 0 12px rgba(52, 211, 153, 0.01); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.05); }
        }
        .success-card {
            animation: softPulse 4s infinite ease-in-out;
        }

        /* accessibility */
        .btn-login:focus-visible,
        .back-link:focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="success-card">
    <!-- confetti decoration -->
    <div class="confetti-container">
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
        <div class="confetti"></div>
    </div>

    <!-- success icon -->
    <div class="success-icon-wrapper">
        <div class="success-circle">
            <span class="checkmark">✅</span>
        </div>
    </div>

    <!-- header -->
    <div class="success-header">
        <h2>Registration Successful!</h2>
        <div class="success-sub">🎉 Welcome to the AI Interview Prep community</div>
    </div>

    <!-- message -->
    <div class="success-message">
        <p>
            Your account has been created successfully.<br />
            <strong>Start your journey</strong> toward interview mastery.
        </p>
    </div>

    <!-- action button -->
    <a href="/login" class="btn-login">
        🔐 Login Now →
    </a>

    <!-- footer -->
    <div class="success-footer">
        <a href="/" class="back-link">🏠 Home</a>
        <a href="/dashboard" class="back-link">📊 Dashboard</a>
    </div>
</div>
</body>
</html>
