<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock Interview · AI Interview Prep</title>
    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0b1120, #030712);
            padding: 2rem 1.5rem;
            position: relative;
        }

        /* animated background glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.06), transparent 50%),
            radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.04), transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- main container ---------- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ---------- header card ---------- */
        .interview-header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 40px;
            padding: 2rem 2.5rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .interview-header::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, #a78bfa, transparent);
            border-radius: 100%;
            opacity: 0.6;
        }

        .interview-header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f9ff 0%, #b6d4ff 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
            margin-bottom: 0.3rem;
        }

        .interview-sub {
            font-size: 0.95rem;
            color: rgba(203, 213, 225, 0.4);
            font-weight: 400;
        }

        /* ---------- progress indicator ---------- */
        .progress-indicator {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 0.8rem 1.5rem;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .progress-indicator .info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: rgba(203, 213, 225, 0.5);
            font-size: 0.85rem;
        }

        .progress-indicator .info span {
            color: #e2e8f0;
            font-weight: 600;
        }

        .progress-indicator .timer {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(203, 213, 225, 0.4);
            font-size: 0.85rem;
        }

        .progress-indicator .timer .time {
            color: #38bdf8;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- question box ---------- */
        .question-box {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            border-radius: 32px;
            padding: 1.8rem 2rem 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
        }

        .question-box:hover {
            border-color: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.4);
        }

        .question-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 20%, rgba(56, 189, 248, 0.02), transparent 60%);
            pointer-events: none;
        }

        .question-box::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            border-radius: 100%;
            opacity: 0.3;
        }

        .question-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.2rem;
            height: 2.2rem;
            background: rgba(124, 58, 237, 0.08);
            border: 1px solid rgba(124, 58, 237, 0.06);
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #a78bfa;
        }

        .question {
            font-size: 1.05rem;
            font-weight: 500;
            color: #e2e8f0;
            line-height: 1.5;
            flex: 1;
        }

        .question-tag {
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.2rem 0.6rem;
            border-radius: 40px;
            background: rgba(56, 189, 248, 0.05);
            color: rgba(56, 189, 248, 0.3);
            border: 1px solid rgba(56, 189, 248, 0.05);
            white-space: nowrap;
        }

        /* ---------- textarea ---------- */
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 1rem 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
            line-height: 1.6;
        }

        textarea::placeholder {
            color: rgba(148, 163, 184, 0.2);
        }

        textarea:focus {
            border-color: #7c3aed;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.05);
        }

        textarea:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* character count */
        .char-count {
            text-align: right;
            font-size: 0.7rem;
            color: rgba(148, 163, 184, 0.2);
            margin-top: 0.4rem;
            transition: color 0.3s ease;
        }

        .char-count.near-limit {
            color: #fbbf24;
        }

        .char-count.at-limit {
            color: #f87171;
        }

        /* ---------- hidden input ---------- */
        input[type="hidden"] {
            display: none;
        }

        /* ---------- submit button ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            max-width: 280px;
            margin: 1.5rem auto 0;
            padding: 1rem 2.5rem;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: 0.4px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 16px 36px -8px rgba(37, 99, 235, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, #3b82f6, #8b5cf6);
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.5);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-wrapper {
            display: flex;
            justify-content: center;
        }

        /* ---------- footer ---------- */
        .interview-footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(148, 163, 184, 0.12);
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 2rem;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 768px) {
            .interview-header {
                padding: 1.5rem;
                border-radius: 32px;
            }
            .interview-header h1 {
                font-size: 1.8rem;
            }
            .question-box {
                padding: 1.5rem;
                border-radius: 24px;
            }
            .question {
                font-size: 0.95rem;
            }
            textarea {
                min-height: 100px;
                font-size: 0.9rem;
            }
            .progress-indicator {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
                border-radius: 32px;
                padding: 1rem 1.2rem;
            }
            .progress-indicator .info,
            .progress-indicator .timer {
                justify-content: center;
            }
            .btn {
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }
            .interview-header {
                padding: 1.2rem;
                border-radius: 28px;
            }
            .interview-header h1 {
                font-size: 1.4rem;
            }
            .question-box {
                padding: 1.2rem;
                border-radius: 20px;
            }
            .question {
                font-size: 0.9rem;
            }
            .question-number {
                min-width: 1.8rem;
                height: 1.8rem;
                font-size: 0.7rem;
            }
            .question-tag {
                font-size: 0.5rem;
                padding: 0.1rem 0.4rem;
            }
            textarea {
                min-height: 80px;
                padding: 0.8rem 1rem;
                font-size: 0.85rem;
            }
            .progress-indicator {
                padding: 0.8rem 1rem;
                border-radius: 24px;
            }
            .progress-indicator .info,
            .progress-indicator .timer {
                font-size: 0.75rem;
            }
        }

        /* ---------- pulse animation ---------- */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.02); }
            50% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.01); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.02); }
        }
        .interview-header {
            animation: softPulse 4s infinite ease-in-out;
        }

        /* accessibility */
        .btn:focus-visible,
        textarea:focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 3px;
        }

        /* Thymeleaf processing */
        .thymeleaf-processing {
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        /* scrollable container for many questions */
        .questions-scroll {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 0.5rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.05) transparent;
        }

        .questions-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .questions-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .questions-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- header -->
    <header class="interview-header">
        <h1>🎤 AI Mock Interview</h1>
        <div class="interview-sub">Answer each question thoughtfully · AI will evaluate your responses</div>
    </header>

    <!-- progress indicator -->
    <div class="progress-indicator">
        <div class="info">
            📋 Questions
            <span th:text="${#lists.size(questions)}">0</span>
        </div>
        <div class="timer">
            ⏱️ <span class="time" id="timerDisplay">30:00</span>
        </div>
    </div>

    <form action="/submitInterview" method="post">
        <div class="questions-scroll">
            <div class="question-box"
                 th:each="q, stat : ${questions}"
                 th:data-index="${stat.index}">

                <div class="question-header">
                    <span class="question-number" th:text="${stat.count}">1</span>
                    <span class="question" th:text="${q}">Sample question here</span>
                    <span class="question-tag">AI Generated</span>
                </div>

                <textarea
                        th:name="'answer'+${stat.index}"
                        placeholder="Write your answer here... Be specific and structured."
                        required
                        maxlength="2000"
                        th:data-char="'answer'+${stat.index}">
                </textarea>
                <div class="char-count" th:id="'count_'+${stat.index}">0 / 2000</div>
            </div>
        </div>

        <input type="hidden"
               name="totalQuestions"
               th:value="${#lists.size(questions)}" />

        <div class="btn-wrapper">
            <button type="submit" class="btn" id="submitBtn">
                📨 Submit Interview
            </button>
        </div>
    </form>

    <!-- footer -->
    <div class="interview-footer">
        ✦ AI Interview Preparation Platform · 2026 ✦
    </div>
</div>

<script>
    // ---------- character counter ----------
    document.addEventListener('DOMContentLoaded', function() {
        const textareas = document.querySelectorAll('textarea');

        textareas.forEach((textarea) => {
            const charId = textarea.getAttribute('data-char');
            const counter = document.getElementById('count_' + charId);

            if (counter) {
                const updateCounter = () => {
                    const length = textarea.value.length;
                    const max = 2000;
                    counter.textContent = length + ' / ' + max;

                    // visual feedback
                    counter.classList.remove('near-limit', 'at-limit');
                    if (length > max * 0.85) {
                        counter.classList.add('near-limit');
                    }
                    if (length >= max) {
                        counter.classList.add('at-limit');
                    }
                };

                textarea.addEventListener('input', updateCounter);
                updateCounter();
            }
        });

        // ---------- timer ----------
        let minutes = 30;
        let seconds = 0;
        const timerDisplay = document.getElementById('timerDisplay');
        const submitBtn = document.getElementById('submitBtn');

        if (timerDisplay) {
            const timerInterval = setInterval(() => {
                if (seconds === 0) {
                    if (minutes === 0) {
                        clearInterval(timerInterval);
                        timerDisplay.textContent = '⏰ Time\'s up!';
                        timerDisplay.style.color = '#f87171';
                        if (submitBtn) {
                            submitBtn.disabled = true;
                            submitBtn.textContent = '⏰ Time Expired';
                        }
                        return;
                    }
                    minutes--;
                    seconds = 59;
                } else {
                    seconds--;
                }

                const mins = String(minutes).padStart(2, '0');
                const secs = String(seconds).padStart(2, '0');
                timerDisplay.textContent = mins + ':' + secs;

                // warning when 5 minutes left
                if (minutes <= 5 && seconds === 0) {
                    timerDisplay.style.color = '#fbbf24';
                }
            }, 1000);
        }

        // ---------- prevent accidental form submission ----------
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                const btn = this.querySelector('.btn');
                if (btn) {
                    btn.textContent = '⏳ Submitting...';
                    btn.disabled = true;
                }
            });
        }
    });
</script>
</body>
</html>
