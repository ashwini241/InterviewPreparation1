<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · AI Interview Prep</title>
    <style>
        /* ---------- reset & base ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 30%, #0b1120, #030712);
            padding: 1.5rem;
            margin: 0;
            position: relative;
        }

        /* subtle animated glow - same vibe as landing & login */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 80%, rgba(56, 189, 248, 0.08), transparent 50%),
            radial-gradient(circle at 20% 20%, rgba(168, 85, 247, 0.06), transparent 40%);
            pointer-events: none;
        }

        /* ---------- glass card ---------- */
        .register-card {
            max-width: 480px;
            width: 100%;
            padding: 2.8rem 2.5rem 2.5rem;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8),
            inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease, box-shadow 0.4s ease;
            position: relative;
            z-index: 2;
            text-align: left;
        }

        .register-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9),
            inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* decorative top line */
        .register-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, #a78bfa, transparent);
            border-radius: 100%;
            opacity: 0.6;
        }

        /* ---------- heading ---------- */
        .register-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.3rem;
        }

        .register-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0f9ff 0%, #b6d4ff 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .register-sub {
            font-size: 0.95rem;
            font-weight: 400;
            color: rgba(203, 213, 225, 0.6);
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.8rem;
            display: inline-block;
        }

        /* ---------- form ---------- */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(203, 213, 225, 0.6);
        }

        .input-group input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 0.85rem 1.4rem;
            font-size: 1rem;
            font-family: inherit;
            color: #e2e8f0;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
        }

        .input-group input::placeholder {
            color: rgba(148, 163, 184, 0.3);
            font-weight: 300;
        }

        .input-group input:focus {
            border-color: #7c3aed;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1), inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .input-group input:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* password hint */
        .password-hint {
            font-size: 0.7rem;
            color: rgba(148, 163, 184, 0.35);
            margin-top: 0.2rem;
            padding-left: 0.3rem;
            letter-spacing: 0.2px;
        }

        /* ---------- submit button ---------- */
        .btn-register-submit {
            margin-top: 0.6rem;
            padding: 0.95rem 1.8rem;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #2563eb, #7c3aed);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 24px -6px rgba(37, 99, 235, 0.4),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            letter-spacing: 0.4px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn-register-submit:hover {
            transform: scale(1.02) translateY(-3px);
            box-shadow: 0 16px 36px -8px rgba(37, 99, 235, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
            background: linear-gradient(145deg, #3b82f6, #8b5cf6);
        }

        .btn-register-submit:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.5);
        }

        /* subtle shine on button */
        .btn-register-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -20%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
            transform: rotate(25deg);
            pointer-events: none;
        }

        /* ---------- footer / home link ---------- */
        .register-footer {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(203, 213, 225, 0.5);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(4px);
        }

        .home-link:hover {
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            transform: translateX(-3px);
        }

        .home-link svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .login-tiny {
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.3);
            letter-spacing: 0.3px;
        }

        .login-tiny a {
            color: #a78bfa;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(167, 139, 250, 0.15);
            transition: color 0.2s;
        }

        .login-tiny a:hover {
            color: #c4b5fd;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 480px) {
            .register-card {
                padding: 2rem 1.5rem;
                border-radius: 36px;
            }
            .register-header h2 {
                font-size: 1.7rem;
            }
            .input-group input {
                padding: 0.75rem 1.2rem;
                font-size: 0.95rem;
            }
            .btn-register-submit {
                font-size: 0.95rem;
                padding: 0.85rem 1.4rem;
            }
            .register-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }
        }

        /* ---------- smooth pulse on card (matching landing & login) ---------- */
        @keyframes softPulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.05); }
            50% { box-shadow: 0 0 0 12px rgba(56, 189, 248, 0.01); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.05); }
        }
        .register-card {
            animation: softPulse 4s infinite ease-in-out;
        }

        /* focus-visible accessibility */
        .btn-register-submit:focus-visible,
        .input-group input:focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="register-card">
    <div class="register-header">
        <h2>Create account</h2>
        <span style="font-size:1.4rem;">🚀</span>
    </div>
    <div class="register-sub">start your AI interview journey today</div>

    <form class="register-form" action="/saveUser" method="post">
        <div class="input-group">
            <label for="name">Full name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Alex Rivera" required />
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required />
            <span class="password-hint">min. 8 characters</span>
        </div>

        <button type="submit" class="btn-register-submit">Register →</button>
    </form>

    <div class="register-footer">
        <a href="/" class="home-link">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            Home
        </a>
        <span class="login-tiny">
                Already have an account? <a href="/login">Sign in</a>
            </span>
    </div>
</div>
</body>
</html>
